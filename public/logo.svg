<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" stroke="currentColor" stroke-width="2" class="ib-logo-svg">
  <defs>
    <!-- Premium Gradient -->
    <linearGradient id="logo-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Isometric Cube Vault -->
  <g class="vault-container" stroke="url(#logo-gradient)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Hexagon Outer Border -->
    <polygon points="64,12 108,37 108,89 64,114 20,89 20,37" fill="none" class="outer-hex" />
    <!-- 3D Isometric Lines (to make it a cube/vault) -->
    <line x1="64" y1="12" x2="64" y2="48" class="inner-line" stroke-width="2" opacity="0.6" />
    <line x1="20" y1="37" x2="64" y2="48" class="inner-line" stroke-width="2" opacity="0.6" />
    <line x1="108" y1="37" x2="64" y2="48" class="inner-line" stroke-width="2" opacity="0.6" />
  </g>

  <!-- Inner Neural Network / Brain -->
  <g class="neural-network" fill="url(#logo-gradient)" stroke="url(#logo-gradient)">
    <!-- Connections (Lines) -->
    <path d="M48,55 L58,45 L70,45 L80,55 L74,70 L54,70 Z" stroke-width="1.5" fill="none" opacity="0.4" />
    <path d="M58,45 L64,36 L70,45 M64,36 L64,48 M48,55 L38,62 M80,55 L90,62" stroke-width="1.5" fill="none" opacity="0.4" />
    <path d="M54,70 L48,82 L64,90 L80,82 L74,70" stroke-width="1.5" fill="none" opacity="0.4" />
    <line x1="64" y1="48" x2="64" y2="90" stroke-width="1.5" opacity="0.3" />

    <!-- Nodes (Glow effect applied) -->
    <circle cx="64" cy="36" r="3" />
    <circle cx="58" cy="45" r="3.5" />
    <circle cx="70" cy="45" r="3.5" />
    <circle cx="48" cy="55" r="4" />
    <circle cx="80" cy="55" r="4" />
    <circle cx="64" cy="48" r="4.5" />
    <circle cx="38" cy="62" r="3" />
    <circle cx="90" cy="62" r="3" />
    <circle cx="54" cy="70" r="3.5" />
    <circle cx="74" cy="70" r="3.5" />
    <circle cx="48" cy="82" r="3" />
    <circle cx="80" cy="82" r="3" />
    <circle cx="64" cy="90" r="4" />
  </g>
</svg>
